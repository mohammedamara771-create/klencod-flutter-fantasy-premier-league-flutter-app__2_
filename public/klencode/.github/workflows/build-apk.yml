name: بناء تطبيق APK

# هذا الملف ذاتي الإصلاح:
# - يبحث عن pubspec.yaml في أي مجلد داخل المستودع.
# - إذا لم يجده إطلاقاً، ينشئ مشروع Flutter كاملاً من ملف main.dart الموجود.
# - يعيد توليد مجلد android ليطابق إصدار Flutter على الرانر.
# لذلك لن يظهر خطأ "Expected to find project root" مرة أخرى.

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: عرض محتويات المستودع (تشخيص)
        run: |
          echo "=== جذر المستودع ==="
          ls -la
          echo "=== كل ملفات pubspec.yaml ==="
          find . -name pubspec.yaml -not -path "./.git/*" || true
          echo "=== كل ملفات main.dart ==="
          find . -name main.dart -not -path "./.git/*" || true

      - name: تحديد مجلد المشروع أو إنشاؤه تلقائياً
        id: locate
        shell: bash
        run: |
          set -e

          PUBSPEC="$(find . -name pubspec.yaml \
            -not -path "./.git/*" \
            -not -path "*/build/*" \
            -not -path "*/.dart_tool/*" \
            -not -path "*/ephemeral/*" | head -n 1 || true)"

          if [ -n "$PUBSPEC" ]; then
            DIR="$(dirname "$PUBSPEC")"
            echo "✅ عُثر على المشروع في: $DIR"
          else
            echo "⚠️ لا يوجد pubspec.yaml — سيتم إنشاء المشروع تلقائياً."

            # ابحث عن أفضل ملف main.dart متاح
            MAIN=""
            for CANDIDATE in ./lib/main.dart ./single_file/main.dart; do
              if [ -f "$CANDIDATE" ]; then MAIN="$CANDIDATE"; break; fi
            done
            if [ -z "$MAIN" ]; then
              MAIN="$(find . -name main.dart -not -path "./.git/*" | head -n 1 || true)"
            fi

            if [ -z "$MAIN" ]; then
              echo "::error::لم يتم العثور على أي ملف main.dart في المستودع. ارفع ملفات المشروع أولاً."
              exit 1
            fi
            echo "📄 سيتم استخدام: $MAIN"

            cp "$MAIN" /tmp/main.dart
            # احتفظ بمجلد lib إن وُجد (المشروع متعدد الملفات)
            if [ -d ./lib ]; then cp -r ./lib /tmp/lib_backup; fi

            mkdir -p /tmp/generated
            flutter create --org com.fplstats --project-name fpl_stats \
              --platforms=android /tmp/generated/fpl_stats

            if [ -d /tmp/lib_backup ]; then
              rm -rf /tmp/generated/fpl_stats/lib
              cp -r /tmp/lib_backup /tmp/generated/fpl_stats/lib
            fi
            # تأكد أن lib/main.dart موجود
            if [ ! -f /tmp/generated/fpl_stats/lib/main.dart ]; then
              cp /tmp/main.dart /tmp/generated/fpl_stats/lib/main.dart
            fi

            mkdir -p ./_app
            cp -r /tmp/generated/fpl_stats/. ./_app/
            DIR="./_app"
            echo "✅ تم إنشاء المشروع في: $DIR"
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "--- محتويات مجلد المشروع ---"
          ls -la "$DIR"

      - name: إعادة توليد مجلد android ليطابق إصدار Flutter
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -e
          NAME="$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r' || true)"
          if [ -z "$NAME" ]; then NAME="fpl_stats"; fi
          echo "اسم المشروع: $NAME"

          cp -r lib /tmp/keep_lib
          cp pubspec.yaml /tmp/keep_pubspec.yaml
          rm -rf android

          flutter create --org com.fplstats --project-name "$NAME" --platforms=android .

          rm -rf lib
          cp -r /tmp/keep_lib lib
          cp /tmp/keep_pubspec.yaml pubspec.yaml

      - name: التأكد من وجود حزمة http
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if ! grep -q "^\s*http:" pubspec.yaml; then
            flutter pub add http
          else
            echo "حزمة http موجودة مسبقاً"
          fi

      - name: إضافة صلاحية الإنترنت
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          grep -n "INTERNET" "$MANIFEST" || true

      - name: تنزيل الحزم
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      - name: تحليل الكود (غير مُلزِم)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter analyze || true

      - name: بناء APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: fpl-stats-apk
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error